name: lemsa_nav_kit
description: >
  PageNavigator over auto_route, session guards, and a deep-link table
  for Lemsa Flutter apps.
version: 1.0.1
homepage: https://github.com/fodilfliti/lemsa_nav_kit
repository: https://github.com/fodilfliti/lemsa_nav_kit
issue_tracker: https://github.com/fodilfliti/lemsa_nav_kit/issues
documentation: https://github.com/fodilfliti/lemsa_nav_kit#readme

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  auto_route: ^11.1.0
  flutter:
    sdk: flutter
  flutter_page_kit: ^1.0.0
  flutter_riverpod: ^3.4.2
  lemsa_core_kit: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - navigation
  - auto-route
  - guards
  - deep-links
