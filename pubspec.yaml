name: flutter_nav_kit
description: >
  PageNavigator over auto_route, session guards, and a deep-link table
  for Lemsa Flutter apps.
version: 0.0.1
publish_to: none
homepage: https://github.com/fodilfliti/flutter_nav_kit
repository: https://github.com/fodilfliti/flutter_nav_kit
issue_tracker: https://github.com/fodilfliti/flutter_nav_kit/issues
documentation: https://github.com/fodilfliti/flutter_nav_kit#readme

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  auto_route: ^11.1.0
  flutter:
    sdk: flutter
  flutter_page_kit:
    path: ../flutter_page_kit
  flutter_riverpod: ^2.6.1
  lemsa_core_kit:
    path: ../lemsa_core_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - navigation
  - auto-route
  - guards
  - deep-links
